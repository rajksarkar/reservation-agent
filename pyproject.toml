[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reservation-agent"
version = "0.1.0"
description = "Autonomous restaurant reservation agent for NYC restaurants"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Reservation Agent" }
]
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.2",
    "structlog>=23.2.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "supabase>=2.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
]

[project.scripts]
reservation-agent = "reservation_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reservation_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
