# Minimal config for multi-user web worker mode (Railway deployment)
# Credentials come from Supabase (per-user encrypted), not from this file.

scheduler:
  cancellation_poll_interval: 120
  snipe_wake_before: 30
  snipe_rapid_poll_interval: 0.5
  snipe_duration: 90
  max_backoff: 300

browser:
  headless: true
  slow_mo: 0
  timeout: 30000
  sessions_dir: "/tmp/sessions"

log_level: "INFO"
log_dir: "/tmp/logs"
dry_run: false
